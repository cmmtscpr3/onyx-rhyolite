# Weekly collection: PIHPS food prices and ibid vehicle auctions
#
# NOTE: GitHub fires `schedule` only from the repository's DEFAULT branch.  This
# repo's default is still `claude/indonesia-economic-indicators-n6ihpj`, so this
# cron will not run until `Indonesia-indicators-dashboard` is made the default (or
# this file also exists on the default branch).  `workflow_dispatch` works from
# any branch today, so manual runs are unaffected.
#
# Every collector merges into the datasets and dedupes, so running twice is
# harmless: the second run finds nothing to do and writes nothing.
name: collect-weekly

on:
  schedule:
    - cron: "0 2 * * 6"   # Saturday 02:00 UTC = 09:00 WIB
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change, write nothing"
        type: boolean
        default: false
      full:
        description: "Re-read all history instead of only what is missing"
        type: boolean
        default: false

permissions:
  contents: write        # the run commits refreshed datasets back

concurrency:
  group: collect-weekly
  cancel-in-progress: false   # two runs must never write the same files

env:
  TARGET_BRANCH: Indonesia-indicators-dashboard

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0        # a shallow clone cannot rebase before pushing

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Collectors/requirements.txt

      - run: pip install -r Collectors/requirements.txt

      # ibid is a React single-page app, so it needs a real browser.
      - run: python -m playwright install --with-deps chromium

      # CHROMIUM_PATH=auto because ubuntu-latest ships /usr/bin/google-chrome,
      # which the collector's candidate list would prefer over the build
      # Playwright pins; `auto` tells it to let Playwright choose its own.
      - name: Collect
        run: python Collectors/run.py weekly $DRY_RUN $FULL
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          FULL: ${{ inputs.full && '--full' || '' }}
          CHROMIUM_PATH: auto

      - name: Commit refreshed datasets
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain Dataset)" ]; then
            echo "no dataset changes"; exit 0
          fi
          # Dataset only: a robot must never commit a stray build artefact.
          git add Dataset
          git commit -m "Weekly collection: $(date -u +%Y-%m-%d)"
          # Rebase before pushing so a manual commit landing first does not
          # fail the run; retry because two schedules can just overlap.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$TARGET_BRANCH" \
              && git push origin HEAD:"$TARGET_BRANCH" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
